<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦玉小手机</title>
    <style>

    
    /* 去掉所有点击时的蓝色框框 */
    * {
        outline: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;  /* 防止长按选中文字 */
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
    
    /* 去掉按钮点击时的默认样式 */
    button, a, div {
        -webkit-tap-highlight-color: rgba(0,0,0,0);
        -webkit-touch-callout: none;  /* 防止长按弹出菜单 */
    }



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f1e8 0%, #e8e0d0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #8b7355;
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .spinner {
            border: 4px solid rgba(139, 115, 85, 0.1);
            border-left-color: #8b7355;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-info {
            font-size: 12px;
            color: #a38d6d;
            margin-top: 20px;
            padding: 10px;
            background: rgba(139, 115, 85, 0.05);
            border-radius: 8px;
        }
        
        .manual-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .manual-btn {
            padding: 8px 16px;
            border: 1px solid #8b7355;
            background: transparent;
            color: #8b7355;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .manual-btn:hover {
            background: rgba(139, 115, 85, 0.1);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">📱</div>
        <h1>锦玉小手机</h1>
        <p>正在验证您的访问权限...</p>
        
        <div class="spinner"></div>
        
        <div class="status-info">
            <div id="statusText">检查认证状态...</div>
            <div id="deviceInfo" style="margin-top: 5px; font-size: 11px;"></div>
        </div>
        
        <!-- 手动操作按钮（开发用） -->
        <div class="manual-buttons">
            <button class="manual-btn" onclick="goToAuth()">🔐 去验证页面</button>
            <button class="manual-btn" onclick="goToBook()">📖 去书本动画</button>
            <button class="manual-btn" onclick="clearData()">🔄 清除数据</button>
        </div>
    </div>
    
    <script>
        // 智能跳转逻辑
        function checkAndRedirect() {
            console.log('🔍 开始检查认证状态...');
            
            const deviceId = localStorage.getItem('jy_device_id');
            const isVerified = localStorage.getItem('jy_is_verified') === 'true';
            const qualificationCode = localStorage.getItem('jy_qualification_code');
            
            // 更新状态显示
            document.getElementById('statusText').textContent = 
                `设备: ${deviceId ? '已注册' : '未注册'} | 认证: ${isVerified ? '已通过' : '未通过'}`;
            
            document.getElementById('deviceInfo').textContent = 
                `设备ID: ${deviceId ? deviceId.substring(0, 8) + '...' : '无'}`;
            
            console.log('认证状态:', { deviceId, isVerified, qualificationCode });
            
            // 判断逻辑
            if (!deviceId || !isVerified || !qualificationCode) {
                // 情况1：未认证 → 去验证页面
                console.log('➡️ 跳转到验证页面 auth.html');
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 1500);
            } else {
                // 情况2：已认证 → 去书本动画
                console.log('➡️ 跳转到书本动画 book.html');
                setTimeout(() => {
                    window.location.href = 'book.html';
                }, 1500);
            }
        }
        
        // 手动跳转函数（开发用）
        function goToAuth() {
            console.log('手动跳转到验证页面');
            window.location.href = 'auth.html';
        }
        
        function goToBook() {
            console.log('手动跳转到书本动画');
            window.location.href = 'book.html';
        }
        
        function clearData() {
            if (confirm('确定要清除所有本地数据吗？')) {
                localStorage.clear();
                console.log('数据已清除，刷新页面');
                location.reload();
            }
        }
        
        // 页面加载后启动检查
        window.addEventListener('load', function() {
            console.log('🚀 主入口页面加载完成');
            
            // 显示当前URL信息
            console.log('当前URL:', window.location.href);
            
            // 延迟执行检查，让用户看到加载动画
            setTimeout(checkAndRedirect, 800);
            
            // 3秒后强制检查（防止卡住）
            setTimeout(checkAndRedirect, 3000);
        });
    </script>
</body>
</html>
